name: CI
on:
  push:
    branches: [ main ]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run unit tests
        run: pytest -v

  test:
    runs-on: ubuntu-latest
    env:
      DB_NAME: tododb
      DB_USER: todo
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build and start services
        run: docker compose up -d --build
      - name: Smoke test
        run: |
          curl -sS --fail --retry 10 --retry-delay 2 --retry-all-errors localhost:5000/health
          curl -sS --fail --retry 10 --retry-delay 2 --retry-all-errors -X POST -H "Content-Type: application/json" -d '{"title":"smoke"}' localhost:5000/todos
          curl -sS --fail --retry 10 --retry-delay 2 --retry-all-errors localhost:5000/todos | grep "smoke"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs

  push:
    needs: [unit-test, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/a-elef93/todo-api:latest
            ghcr.io/a-elef93/todo-api:${{ github.sha }}
